<!-- ====================================================================
     TOPBAR GLOBAL (TEMA, USUÁRIO & BREADCRUMB)
     ==================================================================== -->
<header class="topbar">
  <div class="topbar-left">
    <a href="{{ url_for('dashboard') }}" class="sidebar-brand-icon" style="display: inline-flex; align-items: center; justify-content: center; text-decoration: none;" title="Voltar ao Painel Geral">
      <img src="{{ url_for('static', filename='img/cockpit-icon.png') }}" alt="Ícone Cockpit" style="width: 28px; height: 28px; object-fit: contain; vertical-align: middle;">
    </a>
    <div class="breadcrumb">
      <strong><a href="{{ url_for('dashboard') }}" style="color: inherit; text-decoration: none;">Minicurso de IA (32h)</a></strong> <span>›</span> 
      <span id="breadcrumb-current-view">
        {% if active_view == 'cockpit' %}
          Módulo {{ active_meeting_id or 1 }}: Desmistificando a IA
        {% else %}
          Painel Geral
        {% endif %}
      </span>
    </div>
  </div>

  <div class="topbar-actions">
    <!-- Alternador de Tema -->
    <button id="btn-theme-toggle" class="btn" title="Alternar tema claro/escuro">
      🌙
    </button>

    <!-- Identificação do Usuário Conectado & Logout -->
    {% if current_user %}
    <div class="user-auth-pill" style="display: inline-flex; align-items: center; gap: 0.6rem; padding: 0.3rem 0.65rem 0.3rem 0.75rem; background: var(--bg-subtle); border: 1px solid var(--border); border-radius: var(--radius-pill); font-size: 0.82rem; margin-left: 0.25rem;">
      <div style="display: flex; align-items: center; gap: 0.35rem; color: var(--text-main); font-weight: 500;">
        <span style="font-size: 0.95rem;">👤</span>
        <strong>{{ current_user.name }}</strong>
        <span style="font-size: 0.72rem; opacity: 0.75; background: var(--bg-surface); padding: 0.1rem 0.4rem; border-radius: var(--radius-pill); border: 1px solid var(--border);">{{ current_user.role }}</span>
      </div>
      <a href="{{ url_for('logout') }}" class="btn-logout" title="Encerrar sessão de forma segura" style="display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 50%; background: var(--bg-surface); color: var(--text-muted); text-decoration: none; border: 1px solid var(--border); transition: all var(--transition); font-size: 0.78rem;">
        🚪
      </a>
    </div>
    {% endif %}
  </div>
</header>
