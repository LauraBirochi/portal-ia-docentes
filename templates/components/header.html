<!-- ====================================================================
     TOPBAR GLOBAL (TEMA, USUÁRIO & BREADCRUMB)
     ==================================================================== -->
<header class="topbar">
  <div class="topbar-left">
    <a href="{{ url_for('dashboard') }}" class="sidebar-brand-icon topbar-brand-link" title="Voltar ao Painel Geral">
      <img src="{{ url_for('static', filename='img/cockpit-icon.png') }}" alt="Ícone Cockpit" class="topbar-brand-img">
    </a>
    <div class="breadcrumb">
      <strong class="breadcrumb-brand"><a href="{{ url_for('dashboard') }}">Minicurso de IA (32h)</a></strong>
      <span class="breadcrumb-sep">›</span>
      <span id="breadcrumb-current-view" class="breadcrumb-current">
        {% if active_view == 'cockpit' %}
          Módulo {{ active_meeting_id or 1 }}: {{ active_meeting.shortTitle if active_meeting else 'Desmistificando a IA' }}
        {% else %}
          Painel Geral
        {% endif %}
      </span>
    </div>
  </div>

  <div class="topbar-actions">
    <!-- Alternador de Tema -->
    <button id="btn-theme-toggle" class="btn btn-theme-toggle" title="Alternar tema claro/escuro" aria-label="Alternar tema claro/escuro">
      🌙
    </button>

    <!-- Identificação do Usuário Conectado & Logout -->
    {% if current_user %}
    <div class="user-auth-pill">
      <div class="user-auth-identity">
        <span class="user-auth-avatar" aria-hidden="true">👤</span>
        <strong class="user-auth-name">{{ current_user.name }}</strong>
        <span class="user-role-badge">{{ current_user.role }}</span>
      </div>
      <a href="{{ url_for('logout') }}" class="btn-logout" title="Encerrar sessão de forma segura" aria-label="Encerrar sessão de forma segura">
        🚪
      </a>
    </div>
    {% endif %}
  </div>
</header>
