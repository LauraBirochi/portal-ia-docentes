<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Portal de Apoio Docente – Minicurso de Inteligência Artificial{% endblock %}</title>

  <!-- Favicon do Cockpit -->
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='img/favicon.png') }}">
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='img/icon-192.png') }}">

  <!-- Fontes (Non-blocking preconnect) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap">

  <!-- Estilos Acolhedores (Warm Paper & Walnut) -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
  {% block extra_head %}{% endblock %}

  <!-- Contexto do Usuário Autenticado (RBAC) & Fonte Única de Encontros -->
  <script>
    window.CURRENT_USER = {{ {
      'username': current_username,
      'name': current_user.name if current_user else '',
      'role': current_user.role if current_user else '',
      'is_coordinator': is_coordinator
    } | tojson }};
    window.MEETINGS_DATA = {{ (meetings or {}) | tojson }};
  </script>
</head>

<body data-user-role="{{ current_user.role if current_user else '' }}" data-user-name="{{ current_user.name if current_user else '' }}">

  <div class="app-layout">

    <!-- Topbar Global -->
    {% include 'components/header.html' %}

    <!-- Área Principal de Conteúdo -->
    <main class="workbook-container" style="max-width: 1200px; margin: 0 auto; padding: 2rem 1.5rem;">
      {% block content %}{% endblock %}
    </main>

  </div>

  <!-- Scripts da Aplicação (Dados por Encontro & Renderizador Modular) -->
  <script src="{{ url_for('static', filename='js/data/encontro1-data.js') }}"></script>
  <script src="{{ url_for('static', filename='js/data/encontro2-data.js') }}"></script>
  <script src="{{ url_for('static', filename='js/cockpit-renderer.js') }}"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>

</html>
