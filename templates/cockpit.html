<!-- ================================================================
     NÍVEL 2: COCKPIT DA AULA (UNIVERSAL DATA-DRIVEN – ABAS ADAPTADAS POR PERFIL)
     ================================================================ -->

<!-- Barra Superior do Cockpit (Hierarquia Refinada & Sem Cronômetros) -->
<div class="cockpit-header-bar">
  <div class="cockpit-header-left">
    <button id="btn-back-dashboard" class="btn-back-dashboard cockpit-back-link" title="Retornar ao Dashboard Geral">
      ← Voltar ao Painel Geral
    </button>
    <div class="cockpit-header-title-block">
      <div class="cockpit-header-meta">
        <span id="cockpit-module-chip" class="chip chip-warm">Módulo {{ active_meeting_id or 1 }} • 3h Presenciais</span>
        <span class="chip" style="font-size: 0.78rem; opacity: 0.9;">🛠️ Modo Condução Docente</span>
      </div>
      <h1 id="cockpit-module-title" class="cockpit-module-heading">
        Módulo {{ active_meeting_id or 1 }}: {{ active_meeting.shortTitle if active_meeting else 'Desmistificando a IA' }}
      </h1>
    </div>
  </div>

  <div class="cockpit-header-actions" style="display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap;">
    <!-- Botão de Exportação do PDF Oficial 16:9 -->
    <button type="button" id="btn-export-slides" class="btn btn-export-slides" title="Baixar PDF oficial 16:9 dos slides deste encontro" style="display: inline-flex; align-items: center; gap: 0.45rem; padding: 0.65rem 1.1rem;">
      <span>📥</span> <span>Exportar Slides em PDF</span>
    </button>
    <!-- Botão de Abertura dos Slides para o Computador 1 (Projetor) -->
    <a href="{{ url_for('slides', meeting_id=active_meeting_id or 1) }}" target="portal_ia_slides_window" class="btn btn-primary btn-open-slides" style="text-decoration: none; display: inline-flex; align-items: center; gap: 0.45rem; padding: 0.65rem 1.25rem;">
      <span>🖥️</span> <strong>Abrir Slides no Projetor</strong>
    </a>
  </div>
</div>

<!-- ==============================================================
     BARRA STICKY DAS ABAS DE FOCO (RBAC: COORDENADOR vs DOCENTES)
     ============================================================== -->
<nav class="cockpit-tabs-container" aria-label="Navegação das Abas do Cockpit">
  <div class="cockpit-tabs-list">
    <button class="cockpit-tab-btn active" data-tab="fio-meada">
      <span>🎯</span> 1. Fio da Meada
    </button>
    
    <!-- Abas Pedagógicas e de Apoio Docente -->
    <button class="cockpit-tab-btn docente-tab" data-tab="atividades" id="tab-btn-atividades">
      <span>📋</span> 2. Atividade em Aula
    </button>
    <button class="cockpit-tab-btn docente-tab" data-tab="perguntas" id="tab-btn-perguntas">
      <span>⚠️</span> 3. Perguntas dos Alunos
    </button>
  </div>
</nav>

<!-- ==============================================================
     PAINEL 1: 🎯 O FIO DA MEADA (NARRATIVA & CONCEITOS)
     ============================================================== -->
<div id="tab-fio-meada" class="tab-content-panel active">
  <div id="cockpit-fio-meada-container">
    <!-- Renderizado dinamicamente por cockpit-renderer.js -->
  </div>

  {% if not is_coordinator %}
  <!-- Container dos Papéis por Bloco (Divisão Docente Laura & Maria) -->
  <div id="cockpit-papeis-container" style="margin-top: 1.5rem;">
    <!-- Renderizado dinamicamente por cockpit-renderer.js -->
  </div>
  {% endif %}
</div>

<!-- ==============================================================
     PAINEL 2: 📋 ATIVIDADE EM AULA / LABORATÓRIO
     ============================================================== -->
<div id="tab-atividades" class="tab-content-panel">
  <div id="cockpit-gabarito-container">
    <!-- Renderizado dinamicamente por cockpit-renderer.js -->
  </div>
</div>

<!-- ==============================================================
     PAINEL 3: ⚠️ PERGUNTAS DOS ALUNOS & ARMADILHAS
     ============================================================== -->
<div id="tab-perguntas" class="tab-content-panel">
  <div id="cockpit-perguntas-container">
    <!-- Renderizado dinamicamente por cockpit-renderer.js -->
  </div>
</div>
